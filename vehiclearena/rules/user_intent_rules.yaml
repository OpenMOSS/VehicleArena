- id: radio_play
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - Turn on the radio, I want to listen to FM.
      - Play the radio please.
      - Switch to radio.
  expect:
    actions:
    - vw.radio.radio_favorite_play()
  tolerance:
    skip:
    - '*.settings.sound_channel'
    - radio.current_station*
    - radio.history*
- id: radio_off
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - Turn off the radio.
      - Stop the radio please.
  expect:
    actions:
    - vw.radio.radio_play_stop()
- id: window_open
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - Open my window, I want some fresh air.
      - Can you open the window please?
      vague:
      - The air in here feels kind of stale... can we let some air in?
      - It would be nice to get some fresh air in here...
  expect:
    actions:
    - vw.window.carcontrol_window_switch(["driver's seat"], True)
  tolerance:
    any_of:
    - vw.sunroof.carcontrol_sunroof_switch('open')
    - vw.airConditioner.switch(['all'], True)
    - vw.airConditioner.auto_mode_switch(True)
- id: window_close
