    - vw.music.music_soundVolume_increase(degree='large')
  tolerance:
    trend:
      field_pattern: '*.settings.volume'
      direction: increase
      baseline_field: music._settings.volume
- id: music_next
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - Next song please, I don't like this one.
      - Skip this song.
  expect:
    actions:
    - vw.music.music_playList_switch('next')
- id: music_repeat
  domain: user_intent
