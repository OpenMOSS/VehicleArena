      - Stop the music please.
  expect:
    actions:
    - vw.music.set_is_playing(False)
- id: music_volume_down
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - Lower the music volume, it's too loud.
      - Turn down the music a bit.
  expect:
    actions:
    - vw.music.music_soundVolume_decrease(degree='large')
  tolerance:
    trend:
      field_pattern: '*.settings.volume'
      direction: decrease
      baseline_field: music._settings.volume
- id: music_volume_up
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - Turn up the music, I can barely hear it.
      - Crank it up, louder music please.
  expect:
