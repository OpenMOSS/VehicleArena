  tolerance:
    any_of:
    - vw.seat.carcontrol_carSeatBackrest_angle_decrease(degree='little')
    - vw.seat.carcontrol_carSeatBackrest_angle_decrease(degree='tiny')
- id: music_play
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - Can you play some music? Something relaxing.
      - Play some music please.
      - Put on some music and show the lyrics please.
      vague:
      - It's so quiet in here... maybe play some music?
      - The drive feels a bit boring, how about some music?
      - Could we play some tunes? I could use some entertainment.
  expect:
    actions:
    - vw.music.set_is_playing(True)
  tolerance:
    skip:
    - music.current_playlist*
    - '*.settings.sound_channel'
- id: music_play_favorite
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - Play my favorites.
      - Play my favorite playlist.
  expect:
