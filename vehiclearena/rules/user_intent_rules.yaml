# Physical speed/stop intent belongs to the trajectory evaluator.  Cabin
# evaluation still scores navigation route, voice, overlay and destination
# state, but it must not penalise a driver merely for issuing a driving command.
global_skip_fields:
- navigation.desired_speed
- navigation.is_stopped

rules:
- id: nav_start
  domain: user_intent
  trigger:
    user_intent:
      messages: []
  expect:
    actions:
    - vw.navigation.navigation_route_plan('{dest}')
- id: nav_change_dest
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - Change destination to the airport.
      - Go to the mall instead.
  expect:
    actions:
    - vw.navigation.navigation_destination_change('{dest}')
  message_params:
    Change destination to the airport.:
      dest: the airport
    Go to the mall instead.:
      dest: the mall
- id: nav_stop
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - Stop navigating, I know where I'm going.
      - Cancel the navigation please.
  expect:
    actions:
    - vw.navigation.navigation_exit()
- id: nav_add_waypoint
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - Stop by the gas station on the way.
      - Add a stop at the pharmacy.
  expect:
    actions:
    - vw.navigation.navigation_midWay_add(['{waypoint}'])
  message_params:
    Stop by the gas station on the way.:
      waypoint: the gas station
    Add a stop at the pharmacy.:
      waypoint: the pharmacy
- id: request_u_turn
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - We're going the wrong way, make a U-turn.
      - Turn around, we missed it.
      - Please U-turn here.
  expect:
    actions:
    - vw.navigation.navigation_u_turn()
- id: heating
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - It's cold, can you turn on the heater?
      - I'm freezing! Turn on the heat please.
      - It's getting cold in here, warm things up please.
      vague:
      - Hmm, it's getting a bit cold in here, isn't it?
      - Is it just me or is it getting cold in here?
      - Brrr, it's freezing... the temperature has really dropped.
      - It's so chilly, can we warm up the cabin a little?
  expect:
    actions:
    - vw.airConditioner.switch(['all'], True)
    - vw.airConditioner.heat_mode_switch(True)
    - vw.seat.carcontrol_carSeat_heater_switch(True)
  tolerance:
    skip:
    - airConditioner.ac_states.*.temperature
    - airConditioner.ac_states.*.wind_speed
    - '*.settings.temperature'
    any_of:
    - vw.seat.carcontrol_carSeat_heater_switch(True)
    - vw.airConditioner.temperature_increase(['all'], degree='small')
    - vw.steeringWheel.carcontrol_steeringWheel_heater_switch(True)
- id: cooling
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - It's too hot in here, can you turn on the AC?
      - Cool it down please, it's boiling.
      - Turn on the AC full blast and cool it down.
      vague:
      - It's getting really hot in here, don't you think?
      - Wow, it's too warm in here...
      - Is there a way to cool down the cabin a bit?
  expect:
    actions:
    - vw.airConditioner.switch(['all'], True)
    - vw.airConditioner.cool_mode_switch(True)
  tolerance:
    skip:
    - airConditioner.ac_states.*.temperature
    - airConditioner.ac_states.*.wind_speed
    - '*.settings.temperature'
    any_of:
    - vw.seat.carcontrol_carSeat_ventilation_switch(True)
    - vw.airConditioner.temperature_decrease(['all'], degree='small')
    - vw.window.carcontrol_window_switch(["driver's seat"], True)
    - vw.airConditioner.auto_mode_switch(True)
- id: defrost
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - The windshield is fogging up, turn on the defrost!
      - I can barely see, please defrost the windshield.
      vague:
      - Ugh, I can barely see through the windshield, it's all fogging up...
      - The windshield is getting misty, I can barely see the road...
  expect:
    actions:
    - vw.airConditioner.switch(['all'], True)
    - vw.airConditioner.defrost_mode_switch(True)
  tolerance:
    any_of:
    - vw.wiper.carcontrol_wiperBlade_switch(True, 'front')
- id: wiper_on
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - Turn on the wipers.
      - 下雨了，开下雨刷
  expect:
    actions:
    - vw.wiper.carcontrol_wiperBlade_switch(True, 'front')
- id: ac_off
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - Turn off the AC.
      - Stop the air conditioning please.
  expect:
    actions:
    - vw.airConditioner.switch(['all'], False)
- id: temp_increase
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - Make it a bit warmer please.
      - Increase the temperature a few degrees.
  expect:
    actions:
    - vw.airConditioner.switch(['all'], True)
    - vw.airConditioner.temperature_increase(['all'], degree='small')
  tolerance:
    any_of:
    - vw.airConditioner.auto_mode_switch(True)
    trend:
      field_pattern: airConditioner.ac_states.*.temperature
      direction: increase
      baseline_field: airConditioner._ac_states.*.temperature
- id: temp_decrease
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - Make it a bit cooler please.
      - Lower the temperature a few degrees.
  expect:
    actions:
    - vw.airConditioner.switch(['all'], True)
    - vw.airConditioner.temperature_decrease(['all'], degree='small')
  tolerance:
    any_of:
    - vw.airConditioner.auto_mode_switch(True)
    trend:
      field_pattern: airConditioner.ac_states.*.temperature
      direction: decrease
      baseline_field: airConditioner._ac_states.*.temperature
- id: temp_set
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - Set the temperature to 22 degrees.
      - Set the temperature to 26 degrees.
      - Set the temperature to 18 degrees.
  expect:
    actions:
    - vw.airConditioner.switch(['all'], True)
    - vw.airConditioner.temperature_set(['all'], value={temp}, unit='celsius')
  message_params:
    Set the temperature to 22 degrees.:
      temp: 22
    Set the temperature to 26 degrees.:
      temp: 26
    Set the temperature to 18 degrees.:
      temp: 18
- id: recirculate
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - Switch to recirculation mode, close the vents.
      - Turn on internal circulation please.
  expect:
    actions:
    - vw.airConditioner.switch(['all'], True)
    - vw.airConditioner.recycle_mode_switch('internal circulation')
- id: fresh_air
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - Switch to fresh air mode, open the vents.
      - Turn on outside air please.
  expect:
    actions:
    - vw.airConditioner.switch(['all'], True)
    - vw.airConditioner.recycle_mode_switch('external circulation')
- id: air_purify
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - It's really stuffy in here, the air feels stale.
      - Turn on air purification please.
  expect:
    actions:
    - vw.airConditioner.switch(['all'], True)
    - vw.airConditioner.purification_switch('on')
- id: fan_down
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - The fan is too strong, lower it.
      - Less airflow please.
  expect:
    actions:
    - vw.airConditioner.switch(['all'], True)
    - vw.airConditioner.wind_speed_decrease(['all'], degree='large')
- id: fan_up
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - More airflow please, blow harder.
      - Increase the fan speed.
  expect:
    actions:
    - vw.airConditioner.switch(['all'], True)
    - vw.airConditioner.wind_speed_increase(['all'], degree='large')
- id: seat_heater
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - Warm my seat please.
      - Can you turn on the seat heater?
      vague:
      - My seat feels like a block of ice, it's so cold...
      - The seat is freezing, can you warm my seat up?
  expect:
    actions:
    - vw.seat.carcontrol_carSeat_heater_switch(True)
  tolerance:
    any_of:
    - vw.airConditioner.switch(['all'], True)
    - vw.airConditioner.heat_mode_switch(True)
    - vw.airConditioner.temperature_increase(['all'], degree='small')
    trend:
      field_pattern: airConditioner.ac_states.*.temperature
      direction: increase
      baseline_field: airConditioner._ac_states.*.temperature
- id: seat_heater_off
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - Turn off the seat heater.
      - Stop heating the seat.
  expect:
    actions:
    - vw.seat.carcontrol_carSeat_heater_switch(False)
- id: seat_ventilation
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - Turn on seat ventilation, my seat is too warm.
      - Ventilate the seat please, cool it down.
  expect:
    actions:
    - vw.seat.carcontrol_carSeat_ventilation_switch(True)
- id: massage
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - My back is sore, can you turn on the seat massage?
      - Turn on the massage please, I'm stiff.
      vague:
      - Ugh, my shoulders are really tense from the drive...
      - This long drive is killing my back...
  expect:
    actions:
    - vw.seat.carcontrol_carSeat_massager_switch(True)
- id: massage_off
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - Turn off the massage, that's enough.
      - Stop the massage please.
  expect:
    actions:
    - vw.seat.carcontrol_carSeat_massager_switch(False)
- id: seat_recline
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - Recline my seat a bit, I want to lean back.
      - Tilt the seat back please.
  expect:
    actions:
    - vw.seat.carcontrol_carSeatBackrest_angle_increase(degree='large')
  tolerance:
    any_of:
    - vw.seat.carcontrol_carSeatBackrest_angle_increase(degree='little')
    - vw.seat.carcontrol_carSeatBackrest_angle_increase(degree='tiny')
- id: seat_upright
  domain: user_intent
  trigger:
