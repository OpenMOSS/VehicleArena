    - vw.music.music_favorite_play()
- id: music_lyrics
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - Show the lyrics please.
      - Can you display the lyrics?
  expect:
    actions:
    - vw.music.music_player_showLyric(True)
- id: music_shuffle
  domain: user_intent
  trigger:
