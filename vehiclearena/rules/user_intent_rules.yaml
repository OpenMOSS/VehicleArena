  expect:
    actions:
    - vw.video.video_favorite_play()
  tolerance:
    skip:
    - '*.settings.sound_channel'
- id: video_off
  domain: user_intent
  trigger:
    user_intent:
      messages:
      - Stop the video.
      - Turn off the video please.
  expect:
    actions:
    - vw.video.video_play_stop()
- id: unsafe_*
  domain: user_intent
  trigger:
    user_intent:
      messages: []
  expect:
    actions:
    - 'vw.broadcast.broadcast_safety_refusal(True, ''Refused: {category}'')'
